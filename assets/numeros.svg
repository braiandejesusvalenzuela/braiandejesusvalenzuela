<text x="590" y="43" text-anchor="middle" style="font-size:14px;fill:#7f8da6">~/braian/github-stats</text>
<g class="r" style="animation-delay:.2s"><text class="t" x="44" y="100" style="font-size:20px"><tspan class="gr">$</tspan> <tspan class="mut">github --stats</tspan> <tspan class="cy" font-weight="700">braianvalenzuela</tspan><tspan class="cy live"> █</tspan></text></g></svg>