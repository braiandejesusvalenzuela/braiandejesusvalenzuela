<svg width="1180" height="128" viewBox="0 0 1180 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="~/braian/github-stats" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><style>text{font-family:'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace}
