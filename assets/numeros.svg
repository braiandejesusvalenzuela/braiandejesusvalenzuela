<svg width="1180" height="128" viewBox="0 0 1180 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="~/braian/github-stats">
<defs><style>text{font-family:'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace}
.hd{font-size:15px;font-weight:700;fill:#22d3ee;letter-spacing:.5px}
.t{font-size:19px;fill:#e6edf7}
.tb{font-size:23px;font-weight:700;fill:#ffffff}
.mut{font-size:16px;fill:#7f8da6}
.cy{fill:#22d3ee}.vi{fill:#AA9BEF}.gr{fill:#34d399}
.r{opacity:0;animation:fi .6s ease forwards}
.live{animation:bl 1.4s steps(1) infinite}
.sw{animation:sw 8s linear infinite}.sp{animation:sw 10s linear infinite}.cor{animation:br 4.5s ease-in-out infinite}
@keyframes sw{to{stroke-dashoffset:-100}}
@keyframes br{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes fi{to{opacity:1}}
@keyframes bl{0%,60%{opacity:1}61%,100%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.r{animation:none;opacity:1}.live{animation:none}.sw,.sp,.cor{animation:none}.sw,.sp{display:none}}
</style>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#6C63FF"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399" stop-opacity=".6"/></linearGradient>
<linearGradient id="pn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13203a"/><stop offset="1" stop-color="#0f1a2f"/></linearGradient><linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#6C63FF" stop-opacity=".75"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".6"/><stop offset="1" stop-color="#34d399" stop-opacity=".5"/></linearGradient><linearGradient id="bd2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a5f96"/><stop offset=".5" stop-color="#1f3454"/><stop offset="1" stop-color="#2a6b8a"/></linearGradient><filter id="gl" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="3.2"/></filter>
</defs>
<rect width="1180" height="128" rx="22" fill="#070d18"/>
<rect x="12" y="12" width="1156" height="104" rx="18" fill="none" stroke="url(#bd)" stroke-width="5" opacity=".28" filter="url(#gl)"/>
<rect x="12" y="12" width="1156" height="104" rx="18" fill="#0d1626" stroke="url(#bd)" stroke-width="1.8"/>
<rect class="sw" x="12" y="12" width="1156" height="104" rx="18" fill="none" stroke="url(#ln)" stroke-width="5" pathLength="100" stroke-dasharray="12 88" stroke-linecap="round" filter="url(#gl)"/>
<rect class="sw" x="12" y="12" width="1156" height="104" rx="18" fill="none" stroke="#e8fbff" stroke-opacity=".9" stroke-width="1.8" pathLength="100" stroke-dasharray="6 94" stroke-linecap="round" style="animation-delay:.12s"/>
<line x1="13" y1="62" x2="1167" y2="62" stroke="#1b2a44" stroke-width="1.5"/>
<rect x="30" y="61" width="1120" height="2" rx="1" fill="url(#ln)" opacity=".85"/>
